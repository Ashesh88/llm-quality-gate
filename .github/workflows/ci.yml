name: LLM Quality Gate CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    name: Evaluate LLM Quality & Safety Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run API, Safety & Multi-Turn Automation Tests
        run: |
          pytest tests/api tests/safety tests/multiturn -v --tb=short

      - name: Run Playwright E2E UI Tests
        run: |
          pytest tests/ui -v --tb=short

      - name: Run DeepEval Quality Gate (Faithfulness, Relevancy, Hallucination)
        run: |
          pytest tests/eval -v --tb=short

      - name: Publish Summary to GitHub Step Summary
        if: always()
        run: |
          if [ -f reports/summary.md ]; then
            cat reports/summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test & Evaluation HTML Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-quality-gate-report
          path: reports/
          retention-days: 14
