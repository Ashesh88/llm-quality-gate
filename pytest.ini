[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    eval: DeepEval LLM evaluation quality tests
    safety: Adversarial prompt injection & safety tests
    api: FastAPI endpoint and schema tests
    ui: Playwright web automation tests
    multiturn: Multi-turn context retention & recovery tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
